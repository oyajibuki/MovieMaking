name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER || 'AutoCraft502' }}
          HF_SPACE: ${{ vars.HF_SPACE || 'autocutter-pro' }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # Space 側は履歴を持たせずに毎回まっさらな 1 コミットとして push する
          git checkout --orphan deploy
          git add .
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}" deploy:main
