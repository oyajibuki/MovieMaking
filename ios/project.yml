name: AutoCutter
options:
  bundleIdPrefix: com.autocraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  AutoCutter:
    type: application
    platform: iOS
    sources:
      - path: AutoCutter
    info:
      path: AutoCutter/Info.plist
      properties:
        CFBundleDisplayName: AutoCutter
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 動画の音声を解析するために使用します。
        NSSpeechRecognitionUsageDescription: フィラー（えー・あのー等）を検出するために音声認識を使用します。
        NSPhotoLibraryUsageDescription: 編集する動画を読み込むために使用します。
        NSPhotoLibraryAddUsageDescription: 編集した動画を写真アプリに保存するために使用します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autocraft.autocutter
        TARGETS_TALLER_THAN_LAUNCH: "NO"
